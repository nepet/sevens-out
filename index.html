        ${mode === 'dice' ? pairingBlock(r.settings.pairing, 'opairing', host) : ''}
        <span class="h3" id="ostart-h">Who starts the first round</span>
        ${starterSeg}
        <p class="hint" aria-live="polite">${esc(ui.hint || '')}</p>
        ${host ? `<button class="btn primary" data-act="ostart"${seats.length < 2 ? ' disabled' : ''}>${seats.length < 2 ? 'Waiting for at least one more player' : `Start the game · ${seats.length} players`}</button>`
          : waiting(hostName(), 'start the game')}
      </section>` + rules() + footer();
  }

  function sheet(g){
    const head = g.players.map(pl => `<th scope="col">${esc(pl.name)}</th>`).join('');
    const body = g.rounds.map(rd => `<tr><th scope="row">${rd.no}</th>${g.players.map((_, i) => {
      const r = rd.results[i];
      return `<td${i === rd.starter ? ' class="st"' : ''}>${r ? `+${r.pts}${r.rolls != null ? `<small>${r.rolls}×</small>` : ''}` : '–'}</td>`;
    }).join('')}</tr>`).join('');
    const foot = g.players.map(pl => `<td>${pl.score}</td>`).join('');
    return `<details class="fold" data-fold="sheet"${ui.open.sheet ? ' open' : ''}><summary>Score sheet</summary>
      <div class="tablewrap"><table><thead><tr><th scope="col">Round</th>${head}</tr></thead><tbody>${body}</tbody><tfoot><tr><th scope="row">Total</th>${foot}</tr></tfoot></table></div>
      <p class="note"><span class="dot"></span> marks the round's starter. The small number is how many rolls were used.</p></details>`;
  }

  function rules(){
    const set = online() && net.room ? net.room.settings : state.setup;
    const mode = state.game ? state.game.mode : set.mode;
    const hand = state.game ? E.byHand(state.game) : mode !== 'score' && set.pairing !== 'auto';
    return `<details class="fold" data-fold="rules"${ui.open.rules ? ' open' : ''}><summary>Rules</summary><ol>
      <li>On your turn you roll six dice. After each roll you may set aside any pairs that add up to 7 (1+6, 2+5, 3+4). Only such pairs can be set aside; every other die goes back into the next roll.</li>
      <li>The round's starter may roll up to three times and can stop after any roll. The number of rolls the starter used is the limit for everyone else in that round. Everyone else may stop earlier.</li>
      <li>${hand ? 'When you stop, the pips on the dice still on the table are added to your score, including any 7-pairs you missed.' : 'When you stop, all remaining 7-pairs come out and the pips on the dice still on the table are added to your score.'} Clearing all six dice adds nothing.</li>
      <li>The players choose who starts the first round. After that, the player with the highest score starts each round. If several share the highest score, the one who reached that score first starts.</li>
      <li>When anyone reaches ${LIMIT} or more, the round is played to the end. Then the highest score loses. If the highest score is tied, the player who played later in that round loses.</li>
    </ol>${mode === 'score' ? '' : `<p class="note">${hand ? 'Find the 7s yourself: tap two dice that add up to 7 to set them aside.' : 'The app sets pairs aside for you after each roll.'} Tap a pair from the current roll to put it back before rolling again.</p>`}</details>`;
  }

  function devBlock(){
    const live = (state.phase === 'play' || state.phase === 'roundEnd') && !!state.game && (!online() || amHost());
    const confirm = live && ui.confirmEnd
      ? `<div class="confirm"><span>End the game now? The highest score loses${state.phase === 'play' ? ", and the turn in progress isn't counted" : ''}.</span><button class="btn small danger" data-act="endyes">End game now</button><button class="btn small" data-act="endno">Keep playing</button></div>`
      : '';
    return `<details class="fold" data-fold="dev"${ui.open.dev ? ' open' : ''}><summary>Developer</summary>
      <div class="row"><button class="btn ghost" data-act="devconfetti">Play confetti</button><button class="btn ghost" data-act="devdoom">Play shots alarm</button>${live && !ui.confirmEnd ? '<button class="btn ghost" data-act="endearly">End game now</button>' : ''}</div>
      ${confirm}
      <p class="note">Play confetti shows the celebration for setting aside all three pairs. Play shots alarm shows what happens when the third die hits the floor.${live ? ' End game now finishes the game with the current scores.' : ''}</p></details>`;
  }

  function footer(){
    if (ui.confirmNew) return `<div class="foot"><div class="confirm"><span>End this game and go back to the player setup?</span><button class="btn small danger" data-act="newyes">End game</button><button class="btn small" data-act="newno">Keep playing</button></div></div>`;
    if (ui.confirmLeave) return `<div class="foot"><div class="confirm"><span>Leave room ${esc(net.code)}?${state.game && net.inGame ? ' The game goes on without this phone; you can rejoin with the code.' : ''}</span><button class="btn small danger" data-act="oleaveyes">Leave room</button><button class="btn small" data-act="oleaveno">Stay</button></div></div>`;
    const inGame = !online() && (state.phase === 'play' || state.phase === 'roundEnd');
    const soundPick = `<div class="soundpick"><span class="h3" id="snd-h">Sound</span><div class="seg small" role="group" aria-labelledby="snd-h">${SOUND_OPTS.map(([v, label], i) =>
      `<button class="segbtn${soundMode === v ? ' on' : ''}" data-act="sound" data-id="${i}" aria-pressed="${soundMode === v}">${label}</button>`).join('')}</div></div>`;
    const lookPick = `<div class="soundpick"><span class="h3" id="look-h">Look</span><div class="seg small" role="group" aria-labelledby="look-h">${LOOK_OPTS.map(([v, label], i) =>
      `<button class="segbtn${look === v ? ' on' : ''}" data-act="look" data-id="${i}" aria-pressed="${look === v}">${label}</button>`).join('')}</div></div>`;
    const shakeOn = shakePref && (shakeListening || needsMotionPermission());
    const shakePick = canShake() ? `<div class="soundpick"><span class="h3" id="shake-h">Shake to roll</span><div class="seg small" role="group" aria-labelledby="shake-h">${['Off', 'On'].map((label, i) =>
      `<button class="segbtn${(i === 1) === shakeOn ? ' on' : ''}" data-act="shake" data-id="${i}" aria-pressed="${(i === 1) === shakeOn}">${label}</button>`).join('')}</div></div>` : '';
    const end = online() ? '<button class="link" data-act="oleave">Leave room</button>' : inGame ? '<button class="link" data-act="new">New game</button>' : '';
    return `<div class="foot">${soundPick}${lookPick}${shakePick}${end}</div>`;
  }

  // ---------- animations ----------
  let tumbleTimer = null;
  function startTumble(){
    stopTumble();
    tumbleTimer = setInterval(() => { $app.querySelectorAll('[data-tumble]').forEach(el => { el.innerHTML = face(rnd6()); }); }, 70);
  }
  function stopTumble(){ if (tumbleTimer){ clearInterval(tumbleTimer); tumbleTimer = null; } }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // light up the next pair, then fly both dice in an arc from the tray into the set-aside rack
  async function flyNext(){
    const [a, b] = ui.reveal.pairs[ui.reveal.idx];
    await 0; // let any pending render finish so we measure the live dice
    const els = [a, b].map(id => $app.querySelector(`.dice .die[data-id="${id}"]`));
    els.forEach(el => { if (el) el.classList.add('pairing'); });
    await wait(240);
    const from = els.map(el => el ? el.getBoundingClientRect() : null);
    ui.reveal.idx++; render();
    if (!from[0] || !from[1]) return;
    const packs = $app.querySelectorAll('.rack .pair'), last = packs[packs.length - 1];
    const minis = last ? last.querySelectorAll('.die.mini') : [];
    if (minis.length < 2) return;
    minis.forEach(m => { m.style.visibility = 'hidden'; });
    const vals = [state.game.turn.dice[a].value, state.game.turn.dice[b].value];
    await Promise.all(from.map((r, k) => {
      const to = minis[k].getBoundingClientRect();
      const s = to.width / r.width;
      const dx = (to.left + to.width / 2) - (r.left + r.width / 2), dy = (to.top + to.height / 2) - (r.top + r.height / 2);
      const el = document.createElement('span');
      el.className = 'die fly'; el.setAttribute('aria-hidden', 'true');
      el.style.cssText = `--die:${r.width}px;left:${r.left}px;top:${r.top}px`;
      el.innerHTML = face(vals[k]);
      document.body.appendChild(el);
      const spin = k ? -360 : 360;
      const anim = el.animate([
        { transform:'translate(0,0) scale(1) rotate(0deg)' },
        { transform:`translate(${dx * 0.45}px,${dy * 0.45 - 70}px) scale(${(1 + s) / 2 + 0.15}) rotate(${spin / 2}deg)`, offset:0.5 },
        { transform:`translate(${dx}px,${dy}px) scale(${s}) rotate(${spin}deg)` }
      ], { duration:520, delay:k * 70, easing:'cubic-bezier(.45,0,.25,1)', fill:'forwards' });
      return anim.finished.catch(() => {}).then(() => el.remove());
    }));
    minis.forEach(m => { m.style.visibility = ''; });
  }

  // ---------- input ----------
  function tapDie(id){
    const t = state.game.turn, d = t.dice[id];
    if (!d || d.held !== null || d.value === null || ui.rolling || !canAct()) return;
    if (ui.selected === null){
      const hand = E.byHand(state.game);
      if (!hand && !pairable(t).has(id)){ ui.hint = `There is no ${7 - d.value} on the table to go with this ${d.value}.`; ui.nope = id; return; }
      ui.selected = id; ui.hint = hand ? `Now tap a ${7 - d.value}, or tap the ${d.value} again to put it down.` : `Now tap a ${7 - d.value}.`; return;
    }
    if (ui.selected === id){ ui.selected = null; ui.hint = null; return; }
    const s = t.dice[ui.selected];
    if (s.value + d.value === 7){ ui.selected = null; ui.hint = null; dispatch({ type:'pair', a:s.id, b:d.id }); return; }
    ui.hint = `${s.value} + ${d.value} makes ${s.value + d.value}, not 7.`; ui.nope = id;
  }
  function startRoll(){
    const g = state.game;
    if (!g || state.phase !== 'play' || E.isScore(g) || ui.rolling || ui.busy || !canRoll(g.turn) || !canAct()) return;
    resetInputs();
    if (!reduceMotion){ ui.rolling = true; ui.rollStart = Date.now(); }
    dispatch({ type:'roll' }); // roll first, then show the tumbling dice until the result is revealed
    if (ui.rolling){ render(); startTumble(); }
  }
  function toSetup(){ state.phase = 'setup'; state.game = null; delete state.stats; resetUi(); ui.open = {}; }
  function readOnlineFields(){
    const n = document.getElementById('oname'), c = document.getElementById('ocode');
    if (n) ui.online.name = n.value;
    if (c) ui.online.code = c.value;
    const name = (ui.online.name || '').replace(/\s+/g, ' ').trim().slice(0, 16);
    const code = (ui.online.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    return { name, code };
  }

  function handle(a, id, el){
    const g = state.game;
    // while pairs are flying out, only settings and the developer buttons respond
    if ((ui.busy || ui.rolling) && !['sound', 'look', 'shake', 'devconfetti', 'devdoom', 'oleave', 'oleaveyes', 'oleaveno'].includes(a)) return;
    ui.nope = null;
    if (a !== 'stop') ui.armed = null;
    if (a !== 'new') ui.confirmNew = false;
    if (a !== 'endearly') ui.confirmEnd = false;
    if (a !== 'oleave') ui.confirmLeave = false;
    if (state.phase === 'setup' && !online()) ui.hint = null;
    switch (a){
      case 'add':
        if (state.setup.names.length < MAX_PLAYERS){
          state.setup.names.push(''); render();
          const inp = document.getElementById(`name-${state.setup.names.length - 1}`); if (inp) inp.focus();
        }
        return;
      case 'remove': {
        const s = state.setup; if (s.names.length <= 2) return;
        s.names.splice(id, 1);
        if (s.starter === id) s.starter = 0; else if (s.starter > id) s.starter--;
        break;
      }
      case 'randstart': {
        const s = state.setup; s.starter = Math.floor(Math.random() * s.names.length);
        ui.hint = `${s.names[s.starter].trim() || `Player ${s.starter + 1}`} starts the first round.`;
        break;
      }
      case 'start': {
        const s = state.setup;
        const names = s.names.map((nm, i) => nm.trim() || `Player ${i + 1}`);
        ui.open = {};
        state.stats = { id:randomId(), startedAt:Date.now() }; // for the owner's statistics (see queueReport)
        dispatch({ type:'start', names, starter:Math.min(s.starter, names.length - 1), mode:s.mode === 'score' ? 'score' : 'dice', pairing:s.pairing === 'auto' ? 'auto' : 'manual' });
        return;
      }
      case 'roll': startRoll(); return;
      case 'die': tapDie(id); break;
      case 'unpair': if (canAct()) dispatch({ type:'unpair', index:id }); break;
      case 'takeall': if (canAct()){ ui.selected = null; dispatch({ type:'takeall' }); } break;
      case 'drop': if (state.phase === 'play' && E.isScore(g) && seated()) dispatch({ type:'drop' }); break;
      case 'edit':
        if (!E.isScore(g) || state.phase === 'setup' || !g.players[id] || !seated()) return;
        ui.edit = id; ui.editVals = {};
        break;
      case 'ecancel': ui.edit = null; ui.editVals = {}; break;
      case 'estep': {
        const inp = document.getElementById(`edit-${id}`); if (!inp || !el) return;
        let v = parseInt(inp.value, 10); if (isNaN(v)) v = 0;
        v = Math.max(0, Math.min(MAX_PIPS, v + (+el.dataset.d || 0)));
        inp.value = String(v); ui.editVals[id] = String(v);
        refreshEdit();
        return;
      }
      case 'esave': if (ui.edit != null) saveEdits(); break;
      case 'devdoom': showDoom(state.phase === 'play' && g ? pname(current(g)) : 'Test player'); break;
      case 'stop': {
        const t = g.turn; if (!t.rolls || !canAct()) return;
        if (canRoll(t) && ui.armed !== 'stop'){
          ui.armed = 'stop';
          const left = t.maxRolls - t.rolls;
          ui.hint = g.pos === 0
            ? `Stopping now sets the limit to ${plural(t.rolls, 'roll')} for everyone this round. Tap again to confirm.`
            : `${coveringFor() ? `${pname(current(g))} still has` : 'You still have'} ${plural(left, 'roll')}. Tap again to stop.`;
          break;
        }
        dispatch({ type:'stop' }); break;
      }
      case 'end': if (g.turn.rolls && canAct()) dispatch({ type:'stop' }); break;
      case 'nextround': if (seated()) dispatch({ type:'nextround' }); break;
      case 'new': ui.confirmNew = true; break;
      case 'newyes': toSetup(); break;
      case 'newno': break;
      case 'again': toSetup(); break;
      case 'endearly': if ((state.phase === 'play' || state.phase === 'roundEnd') && (!online() || amHost())) ui.confirmEnd = true; break;
      case 'endyes': if (state.phase === 'play' || state.phase === 'roundEnd') dispatch({ type:'endearly' }); break;
      case 'endno': break;
      case 'shake': {
        if (!canShake()) return;
        const store = v => { try { localStorage.setItem(SHAKE_KEY, v ? '1' : '0'); } catch (e) {} };
        if (id !== 1){ shakePref = false; store(false); listenMotion(false); break; }
        // ask right inside the tap, before anything async, or iPhone refuses
        askMotion().then(ok => {
          shakePref = ok; store(ok); listenMotion(ok);
          ui.hint = ok ? 'Shake the phone to roll the dice.' : "Your phone didn't allow motion access, so shake to roll stays off.";
          render();
        });
        return;
      }
      case 'look': {
        const opt = LOOK_OPTS[id]; if (!opt) return;
        look = opt[0];
        try { localStorage.setItem(LOOK_KEY, look); } catch (e) {}
        applyLook();
        break;
      }
      case 'sound': {
        const opt = SOUND_OPTS[id]; if (!opt) return;
        soundMode = opt[0];
        try { localStorage.setItem(SOUND_KEY, soundMode); } catch (e) {}
        if (soundMode !== 'off'){ sound.unlock(); playSound(); }
        break;
      }
      case 'mode': state.setup.mode = id === 1 ? 'score' : 'dice'; break;
      case 'pairing': state.setup.pairing = id === 1 ? 'auto' : 'manual'; break;
      case 'key': {
        if (state.phase !== 'play' || !E.isScore(g) || !canAct()) return;
        ui.hint = null;
        const s = ui.entry === '0' ? String(id) : ui.entry + id;
        if (s.length > 2 || +s > MAX_PIPS){ ui.hint = 'The most you can have left is 36 (six 6s).'; break; }
        ui.entry = String(+s);
        break;
      }
      case 'back': ui.hint = null; ui.entry = (ui.entry || '').slice(0, -1); break;
      case 'clear': ui.hint = null; ui.entry = ''; break;
      case 'rolls': ui.hint = null; ui.rolls = id; break;
      case 'commit': {
        if (state.phase !== 'play' || !E.isScore(g) || !canAct() || ui.entry === '') break;
        const isStarter = g.pos === 0;
        if (isStarter && !ui.rolls) break;
        dispatch({ type:'score', pts:+ui.entry, rolls:isStarter ? ui.rolls : undefined });
        break;
      }
      case 'undo': if (seated()) dispatch({ type:'undo' }); break;
      case 'devconfetti': celebrate(state.phase === 'play' && g ? pname(current(g)) : 'Test player'); break;

      // ----- online -----
      case 'online': ui.screen = 'online'; ui.hint = null; ui.online = {}; break;
      case 'oback': ui.screen = null; ui.hint = null; break;
      case 'ocreate': case 'ojoin': {
        const { name, code } = readOnlineFields();
        if (!name){ ui.hint = 'Enter your name first, so the others know who you are.'; break; }
        try { localStorage.setItem('sevens-out-name', JSON.stringify(name)); } catch (e) {}
        if (a === 'ojoin' && !CODE_RE.test(code)){ ui.hint = 'A room code has 5 letters and digits, like K7QPM.'; break; }
        ui.hint = null;
        netStart(a === 'ocreate' ? { create:true, name } : { create:false, code, name });
        return;
      }
      case 'omode': if (amHost()) netSend({ t:'lobby', op:'settings', mode:id === 1 ? 'score' : 'dice' }); break;
      case 'opairing': if (amHost()) netSend({ t:'lobby', op:'settings', pairing:id === 1 ? 'auto' : 'manual' }); break;
      case 'ostarter': if (amHost()) netSend({ t:'lobby', op:'settings', starter:id < 0 ? 'random' : id }); break;
      case 'ostart': if (amHost()) netSend({ t:'lobby', op:'start' }); break;
      case 'oreopen': if (amHost()) netSend({ t:'lobby', op:'reopen' }); break;
      case 'okick': if (amHost() && el) netSend({ t:'lobby', op:'kick', seat:el.dataset.seat }); break;
      case 'ocopy': {
        const link = shareLink();
        const done = ok => { ui.hint = ok ? 'Link copied. Send it to the others.' : 'Copy the link above and send it to the others.'; render(); };
        try { navigator.clipboard.writeText(link).then(() => done(true), () => { selectText('olink'); done(false); }); }
        catch (e) { selectText('olink'); done(false); }
        return;
      }
      case 'oshare': try { navigator.share({ title:'Sevens Out', text:`Join my Sevens Out game. Room code ${net.code}`, url:shareLink() }).catch(() => {}); } catch (e) {} return;
      case 'oleave': ui.confirmLeave = true; break;
      case 'oleaveyes': netLeave(); break;
      case 'oleaveno': break;
      default: return;
    }
    render();
  }
  function selectText(id){
    const el = document.getElementById(id); if (!el) return;
    try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  }

  // ---------- render / persistence ----------
  function gameView(){
    return (ui.edit != null && E.isScore(state.game)) ? viewEdit()
      : state.phase === 'play' ? (E.isScore(state.game) ? viewScore() : viewPlay())
      : state.phase === 'roundEnd' ? viewRoundEnd()
      : viewOver();
  }
  function render(){
    const f = document.activeElement;
    const key = f && $app.contains(f) && f.dataset && f.dataset.act ? [f.dataset.act, f.dataset.id] : null;
    const typing = f && $app.contains(f) && f.tagName === 'INPUT' && f.dataset && f.dataset.online ? f.id : null;
    if (typing) readOnlineFields();
    let html;
    try {
      html = online() ? (!net.room ? viewConnecting() : (net.room.phase !== 'game' || !state.game) ? viewLobby() : gameView())
        : ui.screen === 'online' ? viewOnlineEntry()
        : state.phase === 'setup' ? viewSetup()
        : gameView();
    } catch (err){
      console.error(err);
      if (online()) return;
      state = blank(); resetUi(); html = viewSetup();
    }
    $app.innerHTML = html;
    if (typing){ const el = document.getElementById(typing); if (el){ el.focus({ preventScroll:true }); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } }
    else if (key){
      const el = $app.querySelector(`[data-act="${key[0]}"]` + (key[1] != null ? `[data-id="${key[1]}"]` : ''));
      if (el) el.focus({ preventScroll:true });
    }
    save();
    if (ui.celebrate){ const nm = ui.celebrate; ui.celebrate = null; celebrate(nm); }
    if (ui.doom){ const nm = ui.doom; ui.doom = null; showDoom(nm); }
  }
  // the phone's own game is saved here; online games live on the server
  function save(){
    if (online()) return;
    // statistics never break playing; queueReport runs first because it may give an old save its id, which is saved with it
    let report = false;
    if (state.phase === 'over'){ try { queueReport(); report = true; } catch (e) {} }
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    if (report){ try { flushReports(); } catch (e) {} }
  }
  function load(){
    try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.phase && s.setup) return s; } catch (e) {}
    return null;
  }

  // ---------- statistics: finished one-phone games are sent to the room server ----------
  // Playing never waits on this. A report that can't be sent waits in localStorage for a later visit;
  // the server checks it against the rules (server/core/stats.js checkReport) and keeps one record per game id.
  const REPORTS_KEY = 'sevens-out-reports', MAX_REPORTS = 20, MAX_SENT = 50;
  let reportSending = false;
  function randomId(){
    const b = new Uint8Array(8);
    try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < b.length; i++) b[i] = Math.floor(Math.random() * 256); }
    return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  }
  function hashText(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(16); }
  function reportUrl(){ const b = serverBase(); return b ? b.replace(/^ws(s?):/, 'http$1:') + '/report' : ''; }
  function readReports(){
    try { const r = JSON.parse(localStorage.getItem(REPORTS_KEY) || 'null'); if (r && Array.isArray(r.queue) && r.sent && typeof r.sent === 'object'){
        r.queue = r.queue.filter(q => q && typeof q.id === 'string' && typeof q.sig === 'string' && q.body && typeof q.body === 'object');
        return r;
      }
    } catch (e) {}
    return { queue:[], sent:{} };
  }
  function writeReports(r){ try { localStorage.setItem(REPORTS_KEY, JSON.stringify(r)); } catch (e) {} }
  // the same sheet as sheetOf() in server/core/stats.js
  function sheetOf(g){
    return {
      players:g.players.map(p => p.name),
      rounds:g.rounds.map(rd => ({ no:rd.no, starter:rd.starter, mark:rd.mark == null ? null : rd.mark, results:rd.results })),
      shots:(g.shots || []).map(s => ({ player:s.player, round:s.round })),
      early:!!g.early
    };
  }
  function queueReport(){
    const g = state.game;
    if (!g || !reportUrl()) return;
    if (!state.stats) state.stats = { id:randomId(), startedAt:null }; // a game saved before reports existed
    const sheet = sheetOf(g), sig = hashText(JSON.stringify(sheet)), id = state.stats.id, r = readReports();
    if (r.sent[id] === sig || r.queue.some(q => q.id === id && q.sig === sig)) return;
    const body = { id, mode:g.mode, startedAt:state.stats.startedAt, finishedAt:Date.now(), sheet };
    r.queue = r.queue.filter(q => q.id !== id).concat([{ id, sig, body }]).slice(-MAX_REPORTS);
    writeReports(r);
  }
  function flushReports(){
    const url = reportUrl();
    if (reportSending || !url || typeof fetch !== 'function') return;
    const item = readReports().queue[0];
    if (!item) return;
    reportSending = true;
    fetch(url, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(item.body) })
      .then(res => res.ok || (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429), () => false)
      .then(done => {
        reportSending = false;
        if (!done) return; // offline or the server is busy: try again on the next visit
        const r = readReports();
        r.queue = r.queue.filter(q => !(q.id === item.id && q.sig === item.sig));
        r.sent[item.id] = item.sig;
        const ids = Object.keys(r.sent);
        ids.slice(0, Math.max(0, ids.length - MAX_SENT)).forEach(k => { delete r.sent[k]; });
        writeReports(r);
        flushReports();
      });
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || !$app.contains(el) || el.disabled) return;
    handle(el.dataset.act, el.dataset.id != null ? +el.dataset.id : null, el);
  });
  // score cards act as buttons in scoreboard mode
  document.addEventListener('keydown', e => {
    const el = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && el && el.matches && el.matches('[role="button"][data-act]') && $app.contains(el)){
      e.preventDefault();
      handle(el.dataset.act, el.dataset.id != null ? +el.dataset.id : null, el);
    }
  });
  $app.addEventListener('input', e => {
    const el = e.target;
    if (el.classList.contains('name-in')){ state.setup.names[+el.dataset.idx] = el.value; save(); }
    if (el.classList.contains('edit-in')){ ui.editVals[+el.dataset.round] = el.value; refreshEdit(); }
    if (el.dataset.online === 'code'){ const v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v !== el.value) el.value = v; ui.online.code = v; }
    if (el.dataset.online === 'name') ui.online.name = el.value;
  });
  $app.addEventListener('change', e => {
    const el = e.target;
    if (el.name === 'starter'){ state.setup.starter = +el.value; save(); }
  });
  document.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    if (e.key === 'Enter' && tag === 'INPUT' && e.target.dataset && e.target.dataset.online){
      e.preventDefault(); handle(e.target.dataset.online === 'code' ? 'ojoin' : (ui.online.code ? 'ojoin' : 'ocreate'), null); return;
    }
    if (state.phase !== 'play' || !state.game || !E.isScore(state.game) || ui.edit != null || !canAct()) return;
    if (e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)){ e.preventDefault(); handle('key', +e.key); }
    else if (e.key === 'Backspace'){ e.preventDefault(); handle('back', null); }
    else if (e.key === 'Enter' && tag !== 'BUTTON'){ e.preventDefault(); handle('commit', null); }
  });
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (d && d.dataset && d.dataset.fold) ui.open[d.dataset.fold] = d.open;
  }, true);

  function start(data){
    const s = (data && data.state) || load();
    if (s && s.setup) state = s;
    flushReports();
    // ?join=CODE opens the join screen with the code filled in
    let join = '';
    try { join = (new URLSearchParams(location.search).get('join') || '').toUpperCase(); } catch (e) {}
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(ONLINE_KEY) || 'null'); } catch (e) {}
    if (saved && saved.code && saved.token && (saved.server || serverBase()) && (!join || join === saved.code)){
      // rejoin the room this phone was in
      Object.assign(net, { code:saved.code, token:saved.token, name:saved.name || '', server:saved.server || serverBase(), want:true });
      netConnect();
      return;
    }
    if (join && CODE_RE.test(join) && onlineAvailable()){ ui.screen = 'online'; ui.joinCode = join; }
    render();
  }
  // read-only view for tests and debugging in the console
  window.SevensDebug = Object.freeze({
    get state(){ return E.clone(state); },
    get net(){ return { code:net.code, seat:net.seat, status:net.status, rev:net.rev, room:net.room && E.clone(net.room) }; },
    get busy(){ return ui.busy || ui.rolling; }
  });
  try { window.claude?.hot?.snapshot?.(() => ({ state })); } catch (e) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
