<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Sevens Out: a dice game for 2 to 6 players. Set aside pairs that make 7; once someone reaches 101, the highest score loses.">
<!-- Online play: the room server. Empty = online play hidden; "same-origin" = this host; or wss://… -->
<meta name="sevens-out-server" content="wss://sevens-out.pet-v-ne.workers.dev">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sevens Out">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='13' fill='%236A2129'/%3E%3Cg fill='%23D8B06A'%3E%3Ccircle cx='20' cy='19' r='5.5'/%3E%3Ccircle cx='44' cy='19' r='5.5'/%3E%3Ccircle cx='20' cy='32' r='5.5'/%3E%3Ccircle cx='44' cy='32' r='5.5'/%3E%3Ccircle cx='20' cy='45' r='5.5'/%3E%3Ccircle cx='44' cy='45' r='5.5'/%3E%3C/g%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sevens Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Bungee&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column like a pub table — score strip on top, a stitched leather dice tray as the centrepiece, actions under the thumb, score sheet and rules folded below. */
:root{
  --paper:#ECEEF1; --card:#F9FAFB; --ink:#18202C; --ink-soft:#586273; --line:#CBD1DA;
  --leather:#6A2129; --leather-deep:#3F1218; --on-leather:#F4E7E1; --stitch:#D8B06A;
  --brass:#B5832A; --brass-ink:#1A1306;
  --bone:#F7F2E7; --bone-edge:#D3C8B1; --pip:#1D1915; --shade:rgba(10,12,18,.28);
  --danger:#B3261E; --danger-ink:#FFFFFF; --on-leather-danger:#FF9A8F;
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --die:clamp(3.5rem,17vw,4.5rem);
  /* used by the Vegas look; harmless defaults here */
  --chrome:#CBD1DA; --bulb:#D8B06A; --led:#18202C; --meter:#F9FAFB;
  --reel:#FFFFFF; --reel-mid:#EBE6DC; --reel-edge:#77706A; --reel-ink:#2A0A10; --die-hi:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111318; --card:#191C23; --ink:#E8EAEE; --ink-soft:#9CA4B1; --line:#2B303A;
    --leather:#58171F; --leather-deep:#2A0B10; --brass:#D4A24C;
    --bone:#EFE7D6; --bone-edge:#BDB197; --shade:rgba(0,0,0,.5);
    --danger:#FF8A80; --danger-ink:#2A0606; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111318; --card:#191C23; --ink:#E8EAEE; --ink-soft:#9CA4B1; --line:#2B303A;
  --leather:#58171F; --leather-deep:#2A0B10; --brass:#D4A24C;
  --bone:#EFE7D6; --bone-edge:#BDB197; --shade:rgba(0,0,0,.5);
  --danger:#FF8A80; --danger-ink:#2A0606; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:34rem;margin-inline:auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}
.sr{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* the account's live region sits after #app: at the top, so it never makes the page longer than the screen (the bar's bottom edge) */
#acct-live{top:0}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:800 1.55rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em}
.brand span{color:var(--brass)}
.meta{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--ink-soft)}
.chip b{color:var(--ink);font-weight:700}
.alert{border:1.5px solid var(--danger);border-radius:10px;padding:6px 10px;font-size:.86rem;line-height:1.3;margin:0}
/* the slim header of the play screens (header()): menu button, "Round 4 · 2 rolls max", the room online */
.top.slim{gap:6px 10px;min-height:44px}
.top.slim .top-l{flex:1 1 12rem}
.rnd{margin:0;min-width:0;overflow-wrap:anywhere;font-size:.92rem;line-height:1.2;color:var(--ink-soft)}
.rnd b{font:800 1.35rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
html:root[data-look="vegas"] .rnd b{font-size:1.05rem}
.alert strong{color:var(--danger)}

/* score list: one line per player in this round's playing order (sorted by total at game over);
   the race between rounds (.race-card) draws the same lines */
:is(.board,.race-card){--rowh:36px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 8px 6px;display:flex;flex-direction:column;gap:2px}
/* 5 or 6 players: denser rows, so the whole list stays on screen */
:is(.board,.race-card).dense{--rowh:30px}
/* lines you can tap (real dice, seated): a real 44 px row, also with 5 or 6 players */
:is(.board,.race-card).tall{--rowh:44px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-height:18px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.bhead>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead>span:last-child{flex:none}
.bhead b{color:var(--brass)}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
:is(.board,.race-card) .pl{display:grid;grid-template-columns:12px minmax(0,6.5rem) minmax(0,1fr) 2.4rem 2.6rem;grid-template-rows:minmax(var(--rowh),auto);align-items:center;column-gap:8px;padding-inline:4px 6px;border-radius:8px}
:is(.board,.race-card) .pl.now{background:color-mix(in srgb,var(--brass) 16%,transparent)}
:is(.board,.race-card) .mk{font-size:.7rem;line-height:1;color:var(--brass);visibility:hidden}
:is(.board,.race-card) .pl.now .mk{visibility:visible}
:is(.board,.race-card) .nm{display:flex;align-items:center;gap:5px;min-width:0;font-weight:600;font-size:.9rem;white-space:nowrap}
:is(.board,.race-card) .nt{min-width:0;overflow:hidden;text-overflow:ellipsis}
:is(.board,.race-card) .nm .you{flex:none;margin-left:0}
.sd{flex:none;position:relative;width:11px;height:11px;border-radius:3px;background:var(--brass)}
.sd::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--brass-ink)}
:is(.board,.race-card) .pl.wait:not(.now) :is(.nm,.num){opacity:.55}
.trk{position:relative;height:7px;border-radius:4px;background:var(--line)}
.trk::after{content:"";position:absolute;right:0;top:0;bottom:0;width:15%;border-radius:0 4px 4px 0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--danger) 40%,transparent) 0 3px,transparent 3px 6px)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--brass);z-index:1}
:is(.board,.race-card) .num{font:800 1.2rem/1 var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.dl{font:800 .9rem/1 var(--font-display);color:var(--brass);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.off{font:600 .66rem/1 var(--font-body);color:var(--ink-soft)}
.pl.over .fill{background:var(--danger)}
.pl.over .num{color:var(--danger)}
.pl.lost .dl{font:700 .66rem/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--danger)}
.pl-sub{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:0 10px;margin-top:-4px;padding-bottom:4px;line-height:1.2}
.pl-away{font-size:.72rem;font-weight:700;color:var(--ink-soft)}
.pl-shots{font-size:.72rem;font-weight:700;color:var(--danger)}
.pl.editable{cursor:pointer}
.pl.editable:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.pl.editable.now:hover{background:color-mix(in srgb,var(--brass) 24%,transparent)}
.bfoot{margin:2px 0 0;font-size:.72rem;color:var(--ink-soft)}
/* without color-mix() (Safari before 16.2): plain tokens. A plain declaration placed before a color-mix() one wouldn't
   help: a declaration with var() is checked only after the tokens are filled in, and an invalid one falls back to unset.
   For the same reason the feature test names plain colours: with var() in it, it would always pass */
@supports not (color:color-mix(in srgb,red 50%,blue)){
  :is(.board,.race-card) .pl.now{background:var(--paper)}
  .trk::after{background:repeating-linear-gradient(135deg,var(--danger) 0 1px,transparent 1px 6px)}
  .pl.editable:hover{background:var(--paper)}
  .pl.editable.now:hover{background:var(--line)}
}

/* turn */
.turn{display:flex;flex-direction:column;gap:10px}
.turnhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brass);margin:0}
.who{font:800 2.5rem/.95 var(--font-display);margin:2px 0 0;overflow-wrap:anywhere;text-wrap:balance}
.sub{margin:0;color:var(--ink-soft);font-size:.9rem;max-width:46ch}
.rolls{display:flex;align-items:center;gap:8px;flex:none}
.slots{display:flex;gap:6px}
.slot{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink-soft)}
.slot.used{background:var(--ink);border-color:var(--ink)}
.slot.off{border-style:dashed;opacity:.35}
.rolls small{font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums}

/* tray */
.tray{position:relative;border-radius:20px;padding:16px 18px 20px;background:radial-gradient(120% 90% at 50% 15%,var(--leather),var(--leather-deep));box-shadow:inset 0 3px 14px var(--shade);color:var(--on-leather)}
.tray::before{content:"";position:absolute;inset:7px;border:1.5px dashed var(--stitch);border-radius:14px;opacity:.5;pointer-events:none}
.tray-top{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tlabel{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85}
.tval{font:800 2rem/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--stitch)}
.dice{position:relative;display:grid;grid-template-columns:repeat(3,var(--die));justify-content:center;gap:14px 18px;padding-block:14px 4px}

/* dice */
.die{width:var(--die);height:var(--die);border-radius:22%;border:0;padding:calc(var(--die) * .15);background:var(--bone);box-shadow:0 4px 0 var(--bone-edge),0 8px 14px var(--shade);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center;transition:transform .15s ease,box-shadow .15s ease}
.die i{display:block;width:72%;aspect-ratio:1}
.die i.pip{border-radius:50%;background:var(--pip)}
button.die:active{transform:translateY(2px)}
.die.can{box-shadow:0 4px 0 var(--bone-edge),0 0 0 2px var(--stitch),0 8px 14px var(--shade)}
.die.sel{transform:translateY(-7px);box-shadow:0 4px 0 var(--bone-edge),0 0 0 4px var(--brass),0 14px 18px var(--shade)}
.die.blank{opacity:.3;box-shadow:none}
.die.gone{background:transparent;box-shadow:none;border:1.5px dashed var(--stitch);opacity:.4}
.die.tumble{animation:tumble .5s ease-out}
.die.nope{animation:nope .3s}
.die.mini{--die:1.9rem;padding:calc(var(--die) * .12);box-shadow:0 2px 0 var(--bone-edge)}
.die.mini i{width:86%}
@keyframes tumble{0%{transform:translateY(-16px) rotate(-28deg)}55%{transform:translateY(3px) rotate(9deg)}100%{transform:none}}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.die,.die.tumble,.die.nope{animation:none;transition:none}}

.hint{min-height:1.45em;margin:0;font-size:.92rem}

/* set-aside rack */
.h3{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.rack{display:flex;flex-wrap:wrap;gap:8px;min-height:2.9rem;align-items:center}
.pair{display:inline-flex;align-items:center;gap:5px;padding:5px 9px 5px 6px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
button.pair{border:1.5px solid var(--brass)}
.seven{font:800 1.15rem/1 var(--font-display);color:var(--brass);margin-left:3px}
.empty{margin:0;font-size:.86rem;color:var(--ink-soft)}

/* the dice turn on the leather (viewPlay(), html.felt): the page takes the table's colours, and inside #app the tokens
   are remapped to ink on leather, so everything drawn with them (the list, buttons, chips) follows in every look */
html.felt,html.felt body{background:var(--leather)}
html:root[data-look="vegas"].felt,html:root[data-look="vegas"].felt body{background-color:var(--leather-deep)}
html.felt :is(#app,.race-card){--ink:var(--on-leather);--ink-soft:color-mix(in srgb,var(--on-leather) 72%,transparent);--line:color-mix(in srgb,var(--on-leather) 22%,transparent);
  --card:color-mix(in srgb,var(--leather-deep) 62%,transparent);--paper:var(--leather-deep);--brass:var(--stitch);--danger:var(--on-leather-danger);--danger-ink:var(--leather-deep);color:var(--ink)}
html.felt .race-badge{background:var(--leather-deep)}
@supports not (color:color-mix(in srgb,red 50%,blue)){
  html.felt :is(#app,.race-card){--ink-soft:var(--on-leather);--line:var(--leather);--card:var(--leather-deep)}
}
html.felt #app{gap:10px}
/* the table takes the room the screen has left: it grows on a tall phone and shrinks first on a short one
   (the dice follow the screen's height too) */
.felt-turn{flex:1 0 auto;gap:8px;--die:clamp(2.75rem,min(17vw,7.8vh),4.5rem)}
.felt-turn .turnhead{flex-wrap:nowrap;align-items:flex-end}
.felt-turn .who{font-size:2.3rem;min-width:0}
html:root[data-look="vegas"] .felt-turn .who{font-size:1.7rem}
.felt-turn .hint{text-align:center}
.tray.table{flex:1 0 auto;display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px 10px}
.table .tray-top{justify-content:flex-end}
.table .tval{font-size:1.6rem}
.table .dice{gap:12px 16px;padding-block:8px}
.table .btn{border-color:currentColor;color:inherit}
.table .empty{color:inherit;opacity:.7}
.rackrow{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px;padding-top:8px;border-top:1.5px dashed var(--stitch)}
.rackrow .rack{min-height:2.6rem}
.racklabel{font-size:.8rem;opacity:.8}
.rackrow .btn.small{margin-left:auto}
html:root[data-look="vegas"] .rackrow{border-top-color:var(--reel-edge)}
/* the real-dice turn (viewScore()): the entry and the keypad sit on the table, the rolls used and the floor row under it */
.felt-turn .tray.table .tray-top{justify-content:space-between}
.felt-turn .entry{font-size:3.4rem;padding-block:2px}
.felt-turn .pad{gap:6px}
.felt-turn .key{min-height:50px}
.rollpick{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rollpick .seg{flex:0 1 13rem;min-width:9rem}
.rollpick .segbtn{min-height:44px}
.hintrow{display:flex;align-items:center;justify-content:space-between;gap:4px 12px;min-height:1.45em}
.hintrow .hint{flex:1 1 auto;text-align:left;min-width:0}
.hintrow .link{flex:none;min-height:44px;padding-block:0}
.hintrow.end{justify-content:center}
.bar .btn.save{min-height:58px}
.bar .row>.cancel{flex:2 1 0;min-width:0}
/* a short phone (375×667): tighter spacing, so the table and the hint stay above the bar where they can */
@media (max-height:700px){
  html.felt #app{padding-top:8px;gap:8px}
  .felt-turn{gap:6px}
  .felt-turn .who{font-size:1.9rem}
  .tray.table{padding:8px 12px}
  .table .dice{padding-block:4px}
  .rackrow .rack{min-height:2.3rem}
  .felt-turn .entry{font-size:2.6rem}
  .felt-turn .key{min-height:44px}
  .bar .btn.two,.bar .waiting{min-height:52px}
}

/* buttons */
.actions{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 9rem}
.btn{min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-size:1.08rem;font-weight:700}
.btn.armed{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.ghost{border-color:var(--line)}
.btn.small{min-height:40px;font-size:.9rem;padding:6px 12px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:6px 0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;font-size:.88rem}

/* panels */
.panel{display:flex;flex-direction:column;gap:12px}
.h2{font:800 1.45rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;margin:0}
.brand-xl{font:800 clamp(3.4rem,18vw,5.2rem)/.86 var(--font-display);text-transform:uppercase;margin:0;letter-spacing:.01em}
.brand-xl span{color:var(--brass)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:8px}
.prow input[type=text]{flex:1;min-width:0;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;font-size:1rem}
.prow input[type=text]:focus-visible{border-color:var(--brass);outline:2px solid var(--brass);outline-offset:0}
.startpick{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--ink-soft);padding:6px 2px;white-space:nowrap;cursor:pointer}
.startpick input{accent-color:var(--brass);width:18px;height:18px;margin:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.textbtn{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 4px 0 10px;border:0;background:none;font-weight:600;font-size:.94rem;color:var(--ink)}
.textbtn svg,.addrow svg,.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pcard{display:flex;flex-direction:column;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.pcard .prow{gap:2px;padding:4px 6px 4px 4px;border-bottom:1px solid var(--line)}
.pcard .prow input[type=text]{height:44px;border:0;background:transparent;border-radius:8px;padding:0 6px;font-weight:600;font-size:1.1rem}
.pcard .prow input[type=text]:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.diepick{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.diepick input{position:absolute;inset:0;z-index:1;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.mkdie{position:relative;width:26px;height:26px;border-radius:7px;box-sizing:border-box;border:2px dashed var(--line)}
.diepick input:checked+.mkdie{border:0;background:var(--brass)}
.diepick input:checked+.mkdie::after{content:"";position:absolute;left:10px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--brass-ink)}
.diepick input:focus-visible+.mkdie{outline:3px solid var(--brass);outline-offset:3px}
.addrow{min-height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;border:0;background:none;font-weight:600;font-size:1rem;color:var(--ink)}
.pdesc{margin:0;color:var(--ink-soft);font-size:.88rem}
.moderow{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;font-weight:600}
.moderow-go{color:var(--ink-soft);font-weight:600;font-size:.88rem;flex:none}
.iconbtn{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:var(--ink-soft);display:grid;place-items:center;flex:none;padding:0}
.verdict{font:800 clamp(3rem,15vw,4.4rem)/.9 var(--font-display);text-transform:uppercase;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.verdict span{color:var(--danger)}

/* folds */
.fold{border-top:1px solid var(--line);padding-top:8px}
.fold summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:40px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"+";font:800 1.4rem/1 var(--font-display);color:var(--ink-soft)}
.fold[open] summary::after{content:"\2013"}
.fold ol{padding-left:1.2rem;margin:6px 0 4px;display:flex;flex-direction:column;gap:7px;max-width:62ch}
.tablewrap{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{text-align:left}
thead th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
td small{color:var(--ink-soft);margin-left:4px;font-size:.72rem}
tfoot th,tfoot td{font-weight:700;border-bottom:0;font-size:1rem}
.dot,td.st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);vertical-align:middle}
td.st::before{margin-right:6px}
.note{font-size:.8rem;color:var(--ink-soft);margin:6px 0 0}
.foot{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;justify-content:space-between}
.soundpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg.small .segbtn{min-height:38px;font-size:.85rem;padding:6px 12px;flex:0 1 auto}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm span{flex-basis:100%;font-size:.9rem}

/* the pinned bottom bar (bar()): the screen's main action under the thumb. #app.has-bar lets it reach the bottom edge */
#app.has-bar{padding-bottom:0;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.bar{position:sticky;bottom:0;z-index:20;margin:auto -16px calc(-1 * env(safe-area-inset-bottom,0px));padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px var(--shade)}
.bar.leather{background:var(--leather-deep);border-top-color:var(--leather);color:var(--on-leather)}
.bar.leather .btn:not(.primary):not(.danger){border-color:var(--on-leather);color:var(--on-leather)}
.bar .row{flex-wrap:nowrap}
.bar .waiting{border-color:currentColor;color:inherit;opacity:.85;min-height:58px}
/* two-line bar buttons: "Stop / take +17" (about 40%) and "Roll 4 dice / last roll" (about 60%) */
.btn.two{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;padding:6px 10px;line-height:1.15}
.btn.two b{font-weight:700;font-size:1.05rem}
.btn.two small{font-size:.8rem;font-weight:500;opacity:.85}
.bar .row>.stop{flex:2 1 0;min-width:0}
.bar .row>.go{flex:3 1 0;min-width:0}
.bar.leather .btn.armed:not(.primary){background:var(--on-leather);border-color:var(--on-leather);color:var(--leather-deep);font-weight:700}

/* the game menu button (menuButton()) */
.top-l{display:flex;align-items:center;gap:10px;min-width:0}
.menubtn{width:44px;height:44px;display:grid;place-items:center;flex:none;padding:0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.menubtn svg,.sheet-close svg{stroke-linejoin:round;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
html:root[data-look="vegas"] .menubtn{background:var(--leather-deep);border-color:var(--chrome)}

/* the bottom sheet (openSheet()): lives outside #app, so a redraw only replaces its title and body */
html.sheet-open{overflow:hidden}
.sheet-layer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-backdrop{position:absolute;inset:0;background:var(--shade);animation:sheet-fade .2s ease-out both}
.sheet{position:relative;width:100%;max-width:34rem;max-height:88dvh;margin-inline:auto;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;border-top:1px solid var(--line);box-shadow:0 -12px 36px var(--shade);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheet-up .26s cubic-bezier(.2,.8,.3,1) both}
.sheet:focus{outline:none}
.sheet-guard{position:absolute;width:1px;height:1px;overflow:hidden}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 16px 8px;flex:none}
.sheet-head .h2{min-width:0;overflow-wrap:anywhere}
.sheet-close{width:44px;height:44px;display:grid;place-items:center;font-size:inherit}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px}
.sheet-body .foot{flex-direction:column;align-items:stretch;gap:12px}
.sheet-body .soundpick{justify-content:space-between}
.sheet-body .seg.small .segbtn{min-height:44px}
.sheet-body .fold summary{min-height:44px}
.quit{display:flex;flex-direction:column;gap:8px}
@keyframes sheet-up{from{transform:translateY(100%)}}
@keyframes sheet-fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-backdrop{animation:none}}

/* home (viewHome(), html.felt.felt-home): full-bleed leather-deep, the title, two dice, one line and Play in the thumb zone */
html.felt-home,html.felt-home body{background:var(--leather-deep)}
html:root[data-look="vegas"].felt-home,html:root[data-look="vegas"].felt-home body{background-color:var(--leather-deep)}
.felt-home{flex:1 0 auto;display:flex;flex-direction:column}
.home-hero{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding-top:16px}
.home-title{font-size:clamp(4.4rem,26vw,6.5rem);line-height:.85;letter-spacing:.01em}
.home-dice{display:flex;gap:10px;--die:3.25rem}
.home-dice .die:first-child{transform:rotate(-8deg)}
.home-dice .die:last-child{transform:rotate(6deg)}
.home-line{margin:0;max-width:19rem;font-size:1rem;line-height:1.45;opacity:.85}
.home-go{padding-block:24px 18px}
.btn.play{width:100%;min-height:68px;border-radius:20px;font:800 2rem/1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;box-shadow:0 6px 0 var(--shade)}
html:root[data-look="vegas"] .btn.play{font-size:1.6rem}
@media (max-height:700px){.home-hero{gap:18px}.home-title{font-size:clamp(3.6rem,20vw,5rem)}.home-go{padding-block:16px 12px}}

/* the tab bar (tabBar()): Play · Online · You, on the home screens only; pinned like the bar, padded for the safe area */
.tabbar{position:sticky;bottom:0;z-index:20;margin:auto -16px calc(-1 * env(safe-area-inset-bottom,0px));padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card);border-top:1px solid var(--line)}
html.felt-home .tabbar{background:var(--leather-deep)}
.felt-home+.tabbar{margin-top:0}
.tab{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;border:0;background:transparent;color:var(--ink-soft);font-size:.75rem;font-weight:500}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab-ic{width:56px;height:28px;border-radius:14px;display:grid;place-items:center}
.tab[aria-current="page"] .tab-ic{background:color-mix(in srgb,var(--brass) 25%,transparent)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab:focus-visible{outline-offset:-3px}
@supports not (color:color-mix(in srgb,red 50%,blue)){.tab[aria-current="page"] .tab-ic{background:var(--line)}}

/* the Play sheet (playBody()): where, dice, the 7s switch and the next step pinned to the sheet's bottom */
.choice{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.choice legend{padding:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:104px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;text-align:left}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:13px;background:color-mix(in srgb,var(--brass) 14%,var(--card))}
.opt svg{width:28px;height:28px;fill:none;stroke:var(--brass);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opt b{display:block;font-size:1rem}
.opt small{display:block;font-size:.82rem;color:var(--ink-soft)}
@supports not (color:color-mix(in srgb,red 50%,blue)){.opt[aria-pressed="true"]{background:var(--paper)}}
.swrow{min-height:56px;display:flex;align-items:center;gap:12px;padding:0 4px}
.swrow>span{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.swrow b{font-size:1rem;font-weight:600}
.swrow small{font-size:.82rem;color:var(--ink-soft)}
.switch{flex:none;position:relative;width:52px;height:32px;border-radius:16px;border:0;padding:0;background:var(--line)}
.switch::before{content:"";position:absolute;inset:-6px -2px}
.switch>span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:var(--card);box-shadow:0 1px 3px var(--shade);transition:transform .15s ease}
.switch[aria-checked="true"]{background:var(--brass)}
.switch[aria-checked="true"]>span{transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){.switch>span{transition:none}}
.sheet-foot{position:sticky;bottom:-20px;margin:0 -16px -20px;padding:10px 16px 16px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.sheet-foot .btn{min-height:56px}
.sheet-foot .hint:empty{display:none}

/* scoreboard mode */
.pick{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.segbtn{flex:1 1 0;min-width:0;min-height:46px;padding:8px 10px;border:0;background:transparent;font-weight:700;font-size:1.05rem;line-height:1.2}
.segbtn+.segbtn{border-left:1.5px solid var(--ink)}
.segbtn.on{background:var(--ink);color:var(--paper)}
.segbtn:focus-visible{outline-offset:-4px}
.seg.mode .segbtn{font-size:.92rem}
.entry{position:relative;text-align:center;font:800 4.6rem/1 var(--font-display);color:var(--stitch);font-variant-numeric:tabular-nums;padding-block:10px 2px}
.entry .ph{opacity:.4}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:800 1.7rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.key:active{background:var(--line)}
.key.fn{font:600 1rem/1 var(--font-body);color:var(--ink-soft)}

/* celebration */
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.fx-banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:51;padding-inline:16px}
.fx-plaque{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 30px 18px;border-radius:20px;background:radial-gradient(120% 120% at 50% 10%,var(--leather),var(--leather-deep));color:var(--on-leather);box-shadow:0 18px 44px var(--shade);text-align:center;animation:plaque-in .55s cubic-bezier(.2,1.5,.4,1) both}
.fx-plaque::before{content:"";position:absolute;inset:6px;border:1.5px dashed var(--stitch);border-radius:14px;opacity:.6}
.fx-title{font:800 clamp(2.8rem,14vw,4rem)/.9 var(--font-display);text-transform:uppercase;letter-spacing:.02em;color:var(--stitch)}
.fx-sub{font-size:.95rem;font-weight:600;overflow-wrap:anywhere}
.fx-banner.out .fx-plaque{animation:plaque-out .5s ease-in both}
@keyframes plaque-in{0%{transform:scale(.35) rotate(-10deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes plaque-out{to{transform:translateY(-24px) scale(.94);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx-plaque,.fx-banner.out .fx-plaque{animation-duration:.01s}}

/* pairs flying out of the tray */
.die.pairing{transform:translateY(-8px) scale(1.07);box-shadow:0 4px 0 var(--bone-edge),0 0 0 4px var(--brass),0 0 22px var(--brass)}
.die.fly{position:fixed;margin:0;z-index:40;pointer-events:none}

/* dice on the floor (scoreboard mode) */
.floor{display:flex;align-items:center;gap:8px 12px;padding:4px 4px 4px 12px;border:1.5px dashed var(--line);border-radius:12px}
.floor-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.floor-txt small{font-size:.74rem;color:var(--ink-soft)}
.floor .btn{white-space:nowrap;min-height:44px}
.fslots{display:flex;gap:6px}
.fslot{width:1.8rem;height:1.8rem;border-radius:8px;border:1.5px dashed var(--ink-soft);display:grid;place-items:center;opacity:.7}
.fslot.last{border-color:var(--danger)}
.fslot.on{border-style:solid;opacity:1}
.fslot .die.mini{--die:1.6rem;transform:rotate(-14deg)}

/* correcting past scores (scoreboard mode) */
.elist{display:flex;flex-direction:column}
.erow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-bottom:1px solid var(--line)}
.erow label{display:flex;flex-direction:column;font-weight:600}
.erow label small{font-weight:400;font-size:.78rem;color:var(--ink-soft)}
.estep{display:flex;align-items:center;gap:6px}
.edit-in{width:4.2rem;height:44px;text-align:center;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:800 1.4rem/1 var(--font-display);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.edit-in::-webkit-inner-spin-button,.edit-in::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.edit-in[aria-invalid="true"]{border-color:var(--danger)}
.edit-in:focus-visible{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass)}
.etotal{margin:4px 0 0;display:flex;align-items:baseline;gap:8px}
.etotal b{font:800 1.8rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.etotal span{color:var(--ink-soft);font-size:.85rem}

/* the round-of-shots takeover: its own dark world in both looks */
.doom{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding-inline:16px;overflow:hidden;color:#FFFFFF;background:radial-gradient(ellipse at 50% 40%,rgba(74,0,12,.98),rgba(0,0,0,.995) 70%);animation:doom-in .3s ease-out both}
.doom.out{animation:doom-out .38s ease-in both}
@keyframes doom-in{from{opacity:0}to{opacity:1}}
@keyframes doom-out{to{opacity:0;transform:scale(1.04)}}
.doom-flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#D00018;animation:doom-flash 1.3s steps(1) both}
@keyframes doom-flash{0%{opacity:0}4%{opacity:.85;background:#D00018}12%{opacity:0}30%{opacity:.9;background:#FFFFFF}33%{opacity:0}38%{opacity:.6;background:#FFFFFF}41%{opacity:0}}
.doom-bolt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;filter:drop-shadow(0 0 8px #FFFFFF) drop-shadow(0 0 22px #9CCBFF);animation:bolt 1.3s steps(1) both}
@keyframes bolt{0%{opacity:0}30%{opacity:1}34%{opacity:0}38%{opacity:1}42%{opacity:0}}
.doom-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:30rem;animation:quake .6s linear 1.05s}
.skull{width:min(50vw,210px);height:auto;overflow:visible;animation:skull-drop .7s cubic-bezier(.3,1.45,.5,1) .4s both;filter:drop-shadow(0 0 26px rgba(255,30,50,.5))}
@keyframes skull-drop{0%{transform:translateY(-150%) scale(.5) rotate(-24deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
.skull .jaw{transform-box:fill-box;transform-origin:50% 0;animation:chatter .14s ease-in-out 1.2s 12 alternate}
@keyframes chatter{to{transform:translateY(10px) rotate(2deg)}}
.skull .eye{animation:eyes .9s ease-in-out infinite alternate}
@keyframes eyes{from{opacity:.5}to{opacity:1}}
.doom-title{margin:4px 0 0;font:800 clamp(3rem,15vw,5rem)/.95 var(--font-display);text-transform:uppercase;color:#FFFFFF;text-shadow:0 0 18px rgba(255,40,60,.9),0 5px 0 #6A0010;text-wrap:balance}
.doom-title .w{display:inline-block;white-space:nowrap}
.doom-title .w span{display:inline-block;animation:slam .5s cubic-bezier(.2,1.7,.4,1) calc(1.05s + var(--i) * 55ms) both}
@keyframes slam{0%{transform:scale(3.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.doom-sub{max-width:34ch;margin:0;font-size:1.05rem;color:#F3DEDE;animation:rise .5s ease-out 1.9s both}
.doom-sub b{color:#FFD34D}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.doom-ok{min-width:12rem;animation:ok-in .4s ease-out 2.3s both}
@keyframes ok-in{from{opacity:0;visibility:hidden;transform:scale(.8)}to{opacity:1;visibility:visible;transform:none}}
#app.quake{animation:quake .9s linear}
@keyframes quake{0%,100%{transform:none}10%{transform:translate(-9px,5px) rotate(-1deg)}20%{transform:translate(8px,-6px) rotate(1deg)}30%{transform:translate(-7px,-4px)}40%{transform:translate(6px,6px) rotate(.6deg)}50%{transform:translate(-5px,3px)}60%{transform:translate(4px,-3px)}70%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@media (prefers-reduced-motion:reduce){.doom,.doom *,#app.quake{animation-duration:.01s!important;animation-delay:0s!important}}

/* a missed 7: the two dice wave, a pair of glasses drops onto them and the table is asked if it needs glasses */
.miss{position:fixed;inset:0;z-index:48;display:grid;place-items:center;padding-inline:16px;pointer-events:none;background:var(--shade);animation:doom-in .25s ease-out both}
.miss.out{animation:doom-out .45s ease-in both}
.miss.out .miss-card{animation:plaque-out .45s ease-in both}
.miss-card{--u:min(1.1px,calc((100vw - 100px) / 260));max-width:100%;gap:6px}
.miss-look{position:relative;width:calc(260 * var(--u));height:calc(124 * var(--u));margin-bottom:6px;animation:tsk .3s ease-in-out 1.75s 2}
@keyframes tsk{25%{rotate:-5deg}75%{rotate:5deg}}
.miss-die{--die:calc(60 * var(--u));position:absolute;top:calc(32 * var(--u));left:calc(44 * var(--u));animation:hop .3s ease-in-out calc(.3s + var(--k) * .15s) 2,magnify .35s cubic-bezier(.2,1.6,.4,1) 1.2s both}
.miss-die+.miss-die{left:calc(156 * var(--u))}
@keyframes hop{50%{translate:0 calc(-18 * var(--u));rotate:calc(12deg - var(--k) * 24deg)}}
@keyframes magnify{from{scale:1}to{scale:1.16}}
.miss-specs{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:specs-drop .55s cubic-bezier(.3,1.25,.5,1) .75s both}
@keyframes specs-drop{0%{translate:0 -260%;rotate:-18deg;opacity:0}30%{opacity:1}72%{translate:0 5%;rotate:3deg;scale:1.07 .88}100%{translate:0 0;rotate:0deg;scale:1;opacity:1}}
.miss-specs .rim{fill:none;stroke:var(--on-leather);stroke-width:15;stroke-linecap:round}
.miss-specs .frame{fill:none;stroke:var(--pip);stroke-width:9;stroke-linecap:round}
.miss-specs .frame circle{fill:var(--card);fill-opacity:.14}
.miss-specs .glint{fill:none;stroke:var(--on-leather);stroke-width:5;stroke-linecap:round;animation:glint .5s ease-out 1.3s both}
@keyframes glint{from{opacity:0}to{opacity:.85}}
.miss-title .w{display:inline-block;white-space:nowrap}
.miss-title .w span{display:inline-block;animation:slam .45s cubic-bezier(.2,1.7,.4,1) calc(1.25s + var(--i) * 45ms) both}
.miss-sub{max-width:30ch;text-wrap:balance;animation:rise .45s ease-out 1.8s both}
.miss-sub b{color:var(--stitch)}
@media (prefers-reduced-motion:reduce){.miss,.miss *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

/* between rounds: the score list lifts and grows into the race to 101, then a leather curtain brings in the next round */
.race{position:fixed;inset:0;z-index:44;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
#app.racing .board{opacity:0}
#app.racing .board~*,#app.racing-all>*{opacity:0;translate:0 40px;transition:opacity .45s,translate .55s cubic-bezier(.4,0,.2,1)}
.race-card{position:absolute;z-index:0;margin:0;transition:top .55s cubic-bezier(.4,0,.2,1),padding-bottom .55s cubic-bezier(.4,0,.2,1),box-shadow .4s}
.race-card.grow{box-shadow:0 14px 40px var(--shade)}
.race-card.grow.badged{padding-bottom:var(--room)}
.race-card .pl{min-height:var(--rowh);transition:min-height .55s cubic-bezier(.4,0,.2,1),grid-template-columns .55s cubic-bezier(.4,0,.2,1)}

<script>
(() => {

  document.body.appendChild($sheet);

  let look = 'pub';
  try { if (localStorage.getItem(LOOK_KEY) === 'vegas') look = 'vegas'; } catch (e) {}

  function rnd6(){
    if (window.crypto && crypto.getRandomValues){

    return `<li class="pl${now ? ' now' : ''}${wait ? ' wait' : ''}${tot >= LIMIT ? ' over' : ''}${lost ? ' lost' : ''}${edit ? ' editable' : ''}" data-id="${i}"${attrs}>`
      + '<span class="mk" aria-hidden="true">▶</span>'
      + `<span class="nm">${starter ? '<i class="sd" role="img" aria-label="Starter"></i>' : ''}<span class="nt">${esc(pl.name)}</span>${user ? tagHtml(user) : ''}${me ? '<small class="you">you</small>' : ''}</span>`
      + `<span class="trk" aria-hidden="true"><span class="fill" style="width:${barWidth(tot)}"></span></span>`
      + `<span class="num">${tot}</span><span class="dl${played && tag == null ? '' : ' off'}">${dl}</span>`
      + (sub ? `<span class="pl-sub">${sub}</span>` : '') + '</li>';
  }

  const barWidth = total => `${(Math.min(total / LIMIT, 1) * 100).toFixed(1)}%`;

  // the turn as it should look right now: pairs that haven't flown out yet are still on the table
  function displayTurn(t){
    if (!ui.reveal) return t;
    const ids = new Set(ui.reveal.pairs.slice(ui.reveal.idx).flat());
    const d = E.clone(t);
    d.dice.forEach(x => { if (ids.has(x.id)) x.held = null; });
    d.pairs = d.pairs.filter(p => !(ids.has(p.a) && ids.has(p.b)));
    return d;
  }
  function dieView(d, can, interactive){
    if (d.held !== null) return `<span class="die gone" aria-hidden="true"></span>`;
    if (ui.rolling) return `<span class="die tumble" data-tumble aria-hidden="true">${face(rnd6())}</span>`;
    if (d.value === null) return `<span class="die blank" aria-hidden="true"></span>`;
    if (!interactive) return `<span class="die" data-id="${d.id}" role="img" aria-label="Die showing ${d.value}">${face(d.value)}</span>`;
    const sel = ui.selected === d.id;
    return `<button class="die${sel ? ' sel' : ''}${can.has(d.id) ? ' can' : ''}${ui.nope === d.id ? ' nope' : ''}" data-act="die" data-id="${d.id}" aria-pressed="${sel}" aria-label="Die showing ${d.value}">${face(d.value)}</button>`;
  }

  const undoLink = g => isScore(g) && seated() && g.history && g.history.length ? '<button class="link" data-act="undo">Undo last entry</button>' : '';

  function viewEdit(){
    const g = state.game, p = ui.edit, s = editState();
    const rows = g.rounds.filter(rd => rd.results[p]);
    const list = rows.length ? rows.map(rd => {
      const r = rd.results[p], raw = ui.editVals[rd.no], v = raw != null ? raw : String(r.pts);
      return `<div class="erow">
          <label for="edit-${rd.no}">Round ${rd.no}${rd.starter === p ? `<small>Started${r.rolls ? ` · ${plural(r.rolls, 'roll')}` : ''}</small>` : ''}</label>
          <div class="estep">
            <button class="iconbtn" data-act="estep" data-id="${rd.no}" data-d="-1" aria-label="One less in round ${rd.no}">−</button>
            <input type="number" inputmode="numeric" min="0" max="36" step="1" id="edit-${rd.no}" class="edit-in" data-round="${rd.no}" value="${esc(v)}">
            <button class="iconbtn" data-act="estep" data-id="${rd.no}" data-d="1" aria-label="One more in round ${rd.no}">+</button>
          </div>
        </div>`;
    }).join('') : `<p class="empty">${esc(pname(p))} hasn't played a turn yet.</p>`;
    return header(g) + board(g, p) + `
      <section class="panel" aria-labelledby="edit-h">
        <div><p class="eyebrow">Correct scores</p><h2 class="who" id="edit-h">${esc(pname(p))}</h2></div>
        <p class="sub">Change the points for any round, then save. Totals, the next starter and the ${LIMIT} rule are worked out again from the corrected sheet.</p>
        <div class="elist">${list}</div>
        <p class="etotal">Total <b id="edit-total">${s.ok ? s.total : '–'}</b><span>was ${g.players[p].score}</span></p>
        <p class="hint" id="edit-err" aria-live="polite">${s.ok ? '' : 'Each round needs a whole number from 0 to 36.'}</p>
      </section>` + bar(`<div class="row"><button class="btn two cancel" data-act="ecancel">Cancel</button><button class="btn two primary go" data-act="esave"${s.ok && s.changed ? '' : ' disabled'}>Save changes</button></div>`);
  }

  // dice on the floor as one compact row: the label, the three slots and the button
  function floorRow(g){
    const drops = g.drops || 0, faces = [5, 2, 6];
    return `<div class="floor">
        <span class="floor-txt"><span class="h3">Dice on the floor</span><small>3rd one pays the shots</small></span>
        <div class="fslots" role="img" aria-label="${drops} of 3 dice on the floor. The third one pays a round of shots">${[0, 1, 2].map(i => `<span class="fslot${i < drops ? ' on' : ''}${i === 2 ? ' last' : ''}">${i < drops ? mini(faces[i]) : ''}</span>`).join('')}</div>
        ${seated() ? '<button class="btn small" data-act="drop">Die dropped</button>' : ''}
      </div>`;
  }
  function shotsSummary(g){
    if (!g.shots || !g.shots.length) return '';
    const counts = {};
    g.shots.forEach(s => { counts[s.player] = (counts[s.player] || 0) + 1; });
    return `<p class="sub">Rounds of shots paid: ${Object.keys(counts).map(i => `${esc(pname(+i))} ${counts[i]}`).join(', ')}.</p>`;
  }
  const waiting = (who, what) => `<p class="waiting"><span class="pulse" aria-hidden="true"></span>Waiting for ${esc(who)} to ${what}.</p>`;

  // the real-dice turn: slim header, score list, the player's line, the leather table with the entry and the keypad,
  // the starter's rolls used, the dice on the floor, and "Save · Name +N" pinned to the bottom
  function viewScore(){
    const g = state.game, p = current(g), isStarter = g.pos === 0, act = canAct();
    const sub = isStarter ? `Starts the round · up to ${plural(MAX_ROLLS, 'roll')}` : `Up to ${plural(g.mark, 'roll')}`;
    const val = ui.entry === '' ? null : +ui.entry;
    const keys = [1,2,3,4,5,6,7,8,9].map(k => `<button class="key" data-act="key" data-id="${k}">${k}</button>`).join('')
      + `<button class="key fn" data-act="clear">Clear</button><button class="key" data-act="key" data-id="0">0</button><button class="key fn" data-act="back" aria-label="Delete last digit">⌫</button>`;
    const rollPick = isStarter
      ? `<div class="rollpick"><span class="h3" id="rolls-h">Rolls used</span><div class="seg" role="group" aria-labelledby="rolls-h">${[1,2,3].map(k => `<button class="segbtn${ui.rolls === k ? ' on' : ''}" data-act="rolls" data-id="${k}" aria-pressed="${ui.rolls === k}">${k}</button>`).join('')}</div></div>`
      : '';
    let label, ready = false;
    if (val === null) label = 'Enter the pips left';
    else if (isStarter && !ui.rolls) label = 'Choose the rolls used';
    else { label = `Save · ${pname(p)} +${val}`; ready = true; }
    let hint = ui.hint != null ? ui.hint : (val === 0 ? 'Zero means all three pairs came out.' : '');
    if (!ui.hint && coveringFor()) hint = `${pname(p)} is offline. As the host you can enter the score for them.`;
    const foot = `<div class="hintrow"><p class="hint" aria-live="polite">${esc(hint)}</p>${undoLink(g)}</div>`;
    const entry = act ? `
        <div class="tray table">
          <div class="tray-top"><span class="tlabel">Pips left on the table</span><span class="tlabel">0–36</span></div>
          <div class="entry" aria-live="polite">${val === null ? '<span class="ph">–</span>' : val}</div>
          <div class="pad">${keys}</div>
        </div>
        ${rollPick}
        ${floorRow(g)}
        ${foot}`
      : `${floorRow(g)}${foot}`;
    const actions = act ? `<button class="btn primary save" data-act="commit"${ready ? '' : ' disabled'}>${esc(label)}</button>` : waiting(pname(p), 'enter their score');
    return header(g) + board(g, p) + `
      <section class="turn felt-turn" aria-label="${esc(pname(p))}'s turn">
        <div class="turnhead"><h2 class="who">${nameOf(p)}</h2><p class="rolls"><small>${sub}</small></p></div>
        ${entry}
      </section>` + bar(actions, { leather:true });
  }

  // the dice turn: slim header, score list, the player's line, the leather table with the dice and the pairs
  // set aside along its bottom edge, one hint line, and Stop | Roll pinned to the bottom
  function viewPlay(){
    const g = state.game, t = displayTurn(g.turn), p = current(g), act = canAct();
    const rolled = t.rolls > 0, done = rolled && !canRoll(t);
    const hand = E.byHand(g); // the player finds the 7s, so nothing on screen gives them away
    const can = rolled && !ui.rolling && act && !hand ? pairable(t) : new Set();
    const pen = hand ? E.sumActive(t) : finalPenalty(t), left = t.maxRolls - t.rolls, nAct = active(t).length;
    const undoable = act && rolled && !ui.rolling && !ui.busy && t.rolls < t.maxRolls;

    const slots = Array.from({length:MAX_ROLLS}, (_, k) => `<span class="slot${k < t.rolls ? ' used' : ''}${k >= t.maxRolls ? ' off' : ''}"></span>`).join('');
    const rollsLabel = rolled ? `Roll ${t.rolls} of ${t.maxRolls}` : `Up to ${plural(t.maxRolls, 'roll')}`;

    let hint = ui.busy ? 'Setting aside the 7s…' : ui.hint;
    if (hint == null){
      if (!act) hint = '';
      else if (!rolled) hint = ui.rolling ? '' : coveringFor() ? `${pname(p)} is offline. As the host you can play for them.`
        : shakeActive() ? `${online() ? 'Your turn. ' : `${pname(p)}, `}tap Roll or shake the phone.` : online() ? 'Your turn. Roll when you\'re ready.' : `${pname(p)}, roll when you're ready.`;
      else if (nAct === 0) hint = 'All six dice are out. Nothing counts against you.';
      else if (hand) hint = done ? 'No rolls left. Set aside any 7s you see, then end your turn.' : 'Find the 7s: tap two dice that add up to 7.';
      else if (can.size) hint = 'Tap two dice that add up to 7 to set them aside.';
      else if (done) hint = 'No rolls left. End your turn.';
      else hint = '';
    }

    const live = undoable && t.pairs.some(pr => pr.roll === t.rolls);
    const rack = t.pairs.length ? t.pairs.map((pr, i) => {
      const a = t.dice[pr.a].value, b = t.dice[pr.b].value;
      return (pr.roll === t.rolls && undoable)
        ? `<button class="pair" data-act="unpair" data-id="${i}" aria-label="Put ${a} and ${b} back on the table">${mini(a)}${mini(b)}<span class="seven">7</span></button>`
        : `<span class="pair" title="Set aside in roll ${pr.roll}">${mini(a)}${mini(b)}<span class="seven">7</span></span>`;
    }).join('') : `<p class="empty">Pairs of 7 land here</p>`;
    const takeall = act && can.size && !done && !ui.rolling && !ui.busy ? '<button class="btn small" data-act="takeall">Set aside all 7s</button>' : '';

    // the bar: Stop | Roll, End turn when no rolls are left, or who we are waiting for
    const two = (cls, a, main, sub, off) => `<button class="btn two ${cls}"${off ? ' disabled' : ` data-act="${a}"`}><b>${main}</b> <small>${sub}</small></button>`;
    const stopBtn = off => ui.armed === 'stop' && !off
      ? `<button class="btn two stop armed" data-act="stop"><b>Confirm stop<span class="sr"> ·</span></b> <small>+${pen}</small></button>`
      : two('stop', 'stop', 'Stop', `take +${pen}`, off);
    const rollsLeft = left === 1 ? 'last roll' : `${plural(left, 'roll')} left`;
    let actions;
    if (!act) actions = waiting(pname(p), rolled ? 'finish their turn' : 'roll');
    else if (ui.rolling || ui.busy) actions = rolled ? `<div class="row">${stopBtn(true)}${two('primary go', 'roll', 'Rolling…', '&nbsp;', true)}</div>`
      : two('primary go', 'roll', 'Rolling…', '&nbsp;', true);
    else if (!rolled) actions = two('primary go', 'roll', `Roll ${diceWord(nAct)}`, rollsLeft);
    else if (done) actions = two('primary go', 'end', `End turn · +${pen}`, nAct ? 'no rolls left' : 'all six dice out');
    else actions = `<div class="row">${stopBtn(false)}${two('primary go', 'roll', `Roll ${diceWord(nAct)}`, rollsLeft)}</div>`;

    return header(g) + board(g, p) + `
      <section class="turn felt-turn" aria-label="${esc(pname(p))}'s turn">
        <div class="turnhead"><h2 class="who">${nameOf(p)}</h2>
          <div class="rolls"><small>${rollsLabel}</small><div class="slots" aria-hidden="true">${slots}</div></div></div>
        <div class="tray table">
          <div class="tray-top"><span class="tlabel">On the table</span><span class="tval">${rolled ? pen : '–'}</span></div>
          <div class="dice">${t.dice.map(d => dieView(d, can, act)).join('')}</div>
          <div class="rackrow"><div class="rack">${rack}</div>${t.pairs.length ? `<span class="racklabel">${live ? 'Tap a pair to put it back' : 'Set aside'}</span>` : ''}${takeall}</div>
        </div>
        <p class="hint" aria-live="polite">${esc(hint)}</p>
      </section>` + bar(actions, { leather:true });
  }

  function viewOver(){
    const g = state.game, L = g.loser, ls = g.players[L].score;
    const tiedWith = g.players.map((_, i) => i).filter(i => i !== L && g.players[i].score === ls);
    let why;
    if (tiedWith.length) why = `Tied at ${ls} with ${listNames(tiedWith)}. ${pname(L)} played later in the last round, so ${pname(L)} loses.`;
    else if (g.early) why = `The game was ended early. ${pname(L)} has the highest score, ${ls}.`;
    else if (g.crosser !== L) why =`${pname(g.crosser)} reached ${LIMIT} first, but ${pname(L)} finished the round higher with ${ls}.`;
    else why = `${pname(L)} reached ${LIMIT} and finished with the highest score, ${ls}.`;
    const winner = g.players.length === 2 ? `<p class="lede"><b>${esc(pname(1 - L))}</b> wins with ${g.players[1 - L].score}.</p>` : '';
    const again = !online() ? '<button class="btn primary" data-act="again">Play again</button>'
      : amHost() ? '<button class="btn primary" data-act="oreopen">Play again with this room</button>'
      : waiting(hostName(), 'start a new game');
    const undo = undoLink(g);
    return header(g) + `
      <section class="panel">
        <p class="eyebrow">${g.early ? 'Ended early in' : 'Game over after'} ${plural(g.round, 'round')}</p>
        <h1 class="verdict"><span>${esc(pname(L))}</span> loses</h1>
        <p class="sub">${esc(why)}</p>
        ${winner}
      </section>` + board(g, -1) + shotsSummary(g) + (undo ? `<div class="hintrow end">${undo}</div>` : '') + bar(again);
  }

  // the signed-in player's line: "You", or "This is me" on the other lines (it swaps in the player name)
  const meSlot = (i, mine) => i === mine ? '<small class="you me-you">You</small>'
    : `<button class="link me-link" data-act="me" data-id="${i}" aria-label="This is me, line ${i + 1}">This is me</button>`;
  // the starter dice's names follow the choice and the typed names without a redraw
  function syncStarters(){
    const s = state.setup;
    $app.querySelectorAll('input[name=starter]').forEach(el => {
      const i = +el.value, nm = (s.names[i] || '').trim() || `Player ${i + 1}`;
      el.setAttribute('aria-label', s.starter === i ? `${nm} starts` : `Let ${nm} start`);
    });
  }
  function syncMe(){
    const mine = myLine(state.setup.names);
    $app.querySelectorAll('[data-me]').forEach(el => { const i = +el.dataset.me, h = meSlot(i, mine); if (el.innerHTML !== h) el.innerHTML = h; });
  }
  // ----- the home screens: the Play tab (home, then Who's playing), Online and You, with the tab bar -----
  const ICONS = {
    play:'M4 4h16v16H4zM9 9h.01M15 15h.01M12 12h.01', online:'M2 6h7v12H2zM15 6h7v12h-7zM9 12h6',
    you:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6',
    table:'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2', real:'M4 6h16M4 12h16M4 18h10'
  };
  const icon = k => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[k]}"/></svg>`;
  // which home screen shows: ui.screen null means home (the Play tab)
  const homeScreen = () => ui.screen || 'home';
  // the bottom tab bar, on the home screens only; Online is left out where online play isn't available
  function tabBar(cur){
    const tabs = [['home', 'Play', 'play'], onlineAvailable() ? ['online', 'Online', 'online'] : null, ['you', 'You', 'you']].filter(Boolean);
    return `<nav class="tabbar" aria-label="Main">${tabs.map(([act, label, ic]) =>
      `<button class="tab" data-act="${act}"${act === cur ? ' aria-current="page"' : ''}><span class="tab-ic">${icon(ic)}</span>${label}</button>`).join('')}</nav>`;
  }
  // home asks one thing: Play (it opens the Play sheet)
  function viewHome(){
    return `<section class="felt-home">
        <div class="home-hero">
          <h1 class="brand-xl home-title marquee">Sevens<br><span>Out</span></h1>
          <div class="home-dice" aria-hidden="true"><span class="die">${face(3)}</span><span class="die">${face(4)}</span></div>
          <p class="home-line">Set aside every pair that makes 7. What's left counts against you.</p>
        </div>
        <div class="home-go"><button class="btn primary play" data-act="play" aria-haspopup="dialog" aria-expanded="${ui.sheet === 'play'}">Play</button></div>
      </section>` + tabBar('home');
  }
  // the Play sheet: where everyone is, the dice, the 7s switch, then the next step. Choices go to state.setup
  // (where is optional: old saves have none and read as 'table')
  const playWhere = () => onlineAvailable() && state.setup.where === 'phones' ? 'phones' : 'table';
  function playBody(){
    const s = state.setup, where = playWhere(), mode = s.mode === 'score' ? 'score' : 'dice', auto = s.pairing === 'auto';
    const opt = (act, id, on, ic, title, sub) => `<button class="opt" data-act="${act}" data-id="${id}" aria-pressed="${on}">${icon(ic)}<span><b>${title}</b><small>${sub}</small></span></button>`;
    const whereSet = onlineAvailable() ? `<fieldset class="choice"><legend class="h3">Where is everyone?</legend><div class="cards">
        ${opt('where', 0, where === 'table', 'table', 'At this table', 'Pass one phone round')}${opt('where', 1, where === 'phones', 'online', 'Own phones', 'Online, with a code')}</div></fieldset>` : '';
    const diceSet = `<fieldset class="choice"><legend class="h3">Dice</legend><div class="cards">
        ${opt('mode', 0, mode === 'dice', 'play', 'In the app', 'Tap to roll')}${opt('mode', 1, mode === 'score', 'real', 'Real dice', 'Enter scores here')}</div></fieldset>`;
    const sw = mode === 'dice' ? pairSwitch(auto, 'pairing', 'autopair') : '';
    let next;
    if (where === 'table') next = `<button class="btn primary" data-act="players">${homeScreen() === 'players' ? 'Done' : 'Next: who\'s playing'}</button>`;
    else {
      // a guest with no saved name gives one here; a signed-in player plays under the player name
      const me = accountFor(serverBase()), name = ui.online.name != null ? ui.online.name : storedName();
      const field = !me && !storedName() ? `<label class="fld" for="oname"><span class="h3">Your name</span>
          <input type="text" id="oname" class="text-in" data-online="name" value="${esc(name)}" placeholder="Your name" maxlength="16" autocomplete="nickname" enterkeyhint="go"></label>` : '';
      next = field + '<button class="btn primary" data-act="ocreate">Create room</button>';
    }
    return whereSet + diceSet + sw + `<div class="sheet-foot"><p class="hint" aria-live="polite">${esc(ui.hint || '')}</p>${next}</div>`;
  }
  // Who's playing (one phone): the players card (a starter die, the name, You / This is me, remove), who starts
  // round 1, a compact row for the dice choices (it opens the Play sheet), and Start game pinned to the bottom
  function modeLine(s){
    return s.mode === 'score' ? 'Real dice · Scores here' : `Dice in the app · ${s.pairing === 'auto' ? 'The app finds the 7s' : 'You find the 7s'}`;
  }
  function viewPlayers(){
    const s = state.setup, mine = myLine(s.names), many = s.names.length > 2;
    const label = i => s.names[i].trim() || `Player ${i + 1}`;
    const rows = s.names.map((nm, i) => `<div class="prow">
        <label class="diepick"><input type="radio" id="starter-${i}" name="starter" value="${i}"${s.starter === i ? ' checked' : ''} aria-label="${esc(s.starter === i ? `${label(i)} starts` : `Let ${label(i)} start`)}"><span class="mkdie" aria-hidden="true"></span></label>
        <label class="sr" for="name-${i}">Name of player ${i + 1}</label>
        <input type="text" id="name-${i}" class="name-in" data-idx="${i}" value="${esc(nm)}" placeholder="Player ${i + 1}" maxlength="16" autocomplete="off" enterkeyhint="done">
        ${account ? `<span class="me-slot" data-me="${i}">${meSlot(i, mine)}</span>` : ''}
        ${many ? `<button class="iconbtn" data-act="remove" data-id="${i}" aria-label="Remove ${esc(label(i))}">${ICON_X}</button>` : ''}
      </div>`).join('');
    return `<header class="top slim"><div class="top-l"><button class="menubtn" data-act="home" aria-label="Back">${ICON_BACK}</button><h1 class="h2" id="players-h">Who's playing</h1></div></header>
      <section class="panel" aria-labelledby="players-h">
        <div class="phead"><h2 class="h3">Players</h2><button class="textbtn" data-act="randstart">${ICON_RANDOM}Random starter</button></div>
        <div class="pcard">${rows}${s.names.length < MAX_PLAYERS ? `<button class="addrow" data-act="add">${ICON_PLUS}Add player</button>` : ''}</div>
        <p class="hint pdesc" aria-live="polite">${esc(ui.hint || 'The die marks who starts round 1.')}</p>
        <button class="moderow" data-act="play" aria-haspopup="dialog" aria-expanded="${ui.sheet === 'play'}"><span>${modeLine(s)}</span><span class="moderow-go">Change</span></button>
      </section>` + bar('<button class="btn primary" data-act="start">Start game</button>');
  }
  // the You tab: your player (accountBlock), then the settings list: Sound, Look, Shake to roll, How to play, Developer
  function viewYou(){
    const seg = (id, label, opts, cur, act) => `<div class="setrow"><span class="setlbl" id="${id}">${label}</span><div class="seg small" role="group" aria-labelledby="${id}">${opts.map(([v, l], i) =>
      `<button class="segbtn${cur === v ? ' on' : ''}" data-act="${act}" data-id="${i}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div></div>`;
    const shakeOn = shakePref && (shakeListening || needsMotionPermission());
    const shake = canShake() ? `<div class="swrow"><span><b id="shake-l">Shake to roll</b><small id="shake-d">Shake the phone to roll the dice</small></span>
        <button class="switch" role="switch" data-act="shake" data-id="${shakeOn ? 0 : 1}" aria-checked="${shakeOn}" aria-labelledby="shake-l" aria-describedby="shake-d"><span></span></button></div>` : '';
    return `<header class="top slim"><div class="top-l"><h1 class="h2" id="you-h">You</h1></div></header>

  async function playRace(recap, swap, g = state.game){

    if (ui.celebrate){ const nm = ui.celebrate; ui.celebrate = null; celebrate(nm); }
    if (ui.doom){ const nm = ui.doom; ui.doom = null; showDoom(nm); }
    if (ui.missed){ const m = ui.missed; ui.missed = null; showMissed(m); }
  }
  // the phone's own game is saved here; online games live on the server
  const write = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
  function save(){
    // during the race between rounds the screen still shows the old state; the new one is already saved (presentRound)
    if (online() || ui.race) return;
    // statistics never break playing; queueReport runs first because it may give an old save its id, which is saved with it
    let report = false;
    if (state.phase === 'over'){ try { queueReport(); report = true; } catch (e) {} }
    write(state);
    if (report){ try { flushReports(); } catch (e) {} }
  }
  function load(){
    try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.phase && s.setup) return s; } catch (e) {}
    return null;
  }

  // ---------- statistics: finished one-phone games are sent to the room server ----------
  // Playing never waits on this. A report that can't be sent waits in localStorage for a later visit;
  // the server checks it against the rules (server/core/stats.js checkReport) and keeps one record per game id.
  const REPORTS_KEY = 'sevens-out-reports', MAX_REPORTS = 20, MAX_SENT = 50;
  let reportSending = false;
  function randomId(){
    const b = new Uint8Array(8);
    try { crypto.getRandomValues(b); } catch (e) { for (let i = 0; i < b.length; i++) b[i] = Math.floor(Math.random() * 256); }
    return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  }
  function hashText(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(16); }
  function reportUrl(){ const b = serverBase(); return b ? b.replace(/^ws(s?):/, 'http$1:') + '/report' : ''; }
  function readReports(){
    try { const r = JSON.parse(localStorage.getItem(REPORTS_KEY) || 'null'); if (r && Array.isArray(r.queue) && r.sent && typeof r.sent === 'object'){
        r.queue = r.queue.filter(q => q && typeof q.id === 'string' && typeof q.sig === 'string' && q.body && typeof q.body === 'object');
        return r;
      }
    } catch (e) {}
    return { queue:[], sent:{} };
  }
  function writeReports(r){ try { localStorage.setItem(REPORTS_KEY, JSON.stringify(r)); } catch (e) {} }
  // the same sheet as sheetOf() in server/core/stats.js
  function sheetOf(g){
    return {
      players:g.players.map(p => p.name),
      rounds:g.rounds.map(rd => ({ no:rd.no, starter:rd.starter, mark:rd.mark == null ? null : rd.mark, results:rd.results })),
      shots:(g.shots || []).map(s => ({ player:s.player, round:s.round })),
      early:!!g.early
    };
  }
  function queueReport(){
    const g = state.game;
    if (!g || !reportUrl()) return;
    if (!state.stats) state.stats = { id:randomId(), startedAt:null }; // a game saved before reports existed
    const sheet = sheetOf(g), sig = hashText(JSON.stringify(sheet)), id = state.stats.id, r = readReports();
    if (r.sent[id] === sig || r.queue.some(q => q.id === id && q.sig === sig)) return;
    const body = { id, mode:g.mode, startedAt:state.stats.startedAt, finishedAt:Date.now(), sheet };
    if (Number.isInteger(state.stats.owner)) body.owner = state.stats.owner;
    // ownerId: whose session may go with it (a report can wait while another player signs in on this phone)
    const ownerId = Number.isInteger(state.stats.owner) && typeof state.stats.ownerId === 'string' ? state.stats.ownerId : null;
    r.queue = r.queue.filter(q => q.id !== id).concat([Object.assign({ id, sig, body }, ownerId ? { ownerId } : {})]).slice(-MAX_REPORTS);
    writeReports(r);
  }
  function flushReports(){
    const url = reportUrl();
    if (reportSending || !url || typeof fetch !== 'function') return;
    const item = readReports().queue[0];
    if (!item) return;
    reportSending = true;
    // the owner's session lets the server credit their line; without it (signed out, or someone else signed in since)
    // the game is stored as a guest game
    const headers = { 'content-type':'application/json' };
    if (item.ownerId && account && account.id === item.ownerId && account.server === authBase()) headers.authorization = `Bearer ${account.token}`;
    fetch(url, { method:'POST', headers, body:JSON.stringify(item.body) })
      .then(res => res.ok || (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429), () => false)
      .then(done => {
        reportSending = false;
        if (!done) return; // offline or the server is busy: try again on the next visit
        const r = readReports();
        r.queue = r.queue.filter(q => !(q.id === item.id && q.sig === item.sig));
        r.sent[item.id] = item.sig;
        const ids = Object.keys(r.sent);
        ids.slice(0, Math.max(0, ids.length - MAX_SENT)).forEach(k => { delete r.sent[k]; });
        writeReports(r);
        flushReports();
      });
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || !($app.contains(el) || $sheet.contains(el)) || el.disabled) return;
    handle(el.dataset.act, el.dataset.id != null ? +el.dataset.id : null, el);
  });
  // score lines act as buttons in scoreboard mode
  document.addEventListener('keydown', e => {
    const el = e.target;
    if ((e.key === 'Enter' || e.key === ' ') && el && el.matches && el.matches('[role="button"][data-act]') && $app.contains(el)){
      e.preventDefault();
      handle(el.dataset.act, el.dataset.id != null ? +el.dataset.id : null, el);
    }
  });
  const onInput = e => {
    const el = e.target;
    if (el.classList.contains('name-in')){ state.setup.names[+el.dataset.idx] = el.value; save(); syncStarters(); if (account) syncMe(); }
    if (el.classList.contains('edit-in')){ ui.editVals[+el.dataset.round] = el.value; refreshEdit(); }
    if (el.dataset.online === 'code'){ const v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v !== el.value) el.value = v; ui.online.code = v; }
    if (el.dataset.online === 'name') ui.online.name = el.value;
    if (el.dataset.account === 'name') ui.account.name = el.value;
    if (el.dataset.account === 'rename') ui.account.renameVal = el.value;
  };
  $app.addEventListener('input', onInput);
  $sheet.addEventListener('input', onInput);
  $app.addEventListener('change', e => {
    const el = e.target;
    if (el.name === 'starter'){ state.setup.starter = +el.value; save(); syncStarters(); }
  });
  document.addEventListener('keydown', e => {
    const tag = e.target && e.target.tagName;
    if (e.key === 'Enter' && tag === 'INPUT' && e.target.dataset && e.target.dataset.online){
      e.preventDefault(); handle(e.target.dataset.online === 'code' ? 'ojoin' : (ui.online.code && !$sheet.contains(e.target) ? 'ojoin' : 'ocreate'), null); return;
    }
    if (e.key === 'Enter' && tag === 'INPUT' && e.target.dataset && e.target.dataset.account){
      e.preventDefault(); handle(e.target.dataset.account === 'rename' ? 'arenamesave' : 'acreate', null); return;
    }
    if (state.phase !== 'play' || !state.game || !E.isScore(state.game) || ui.edit != null || ui.sheet || !canAct()) return;
    if (e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button') return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)){ e.preventDefault(); handle('key', +e.key); }
    else if (e.key === 'Backspace'){ e.preventDefault(); handle('back', null); }
    else if (e.key === 'Enter' && tag !== 'BUTTON'){ e.preventDefault(); handle('commit', null); }
  });
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (d && d.dataset && d.dataset.fold) ui.open[d.dataset.fold] = d.open;
  }, true);

  function start(data){
    const s = (data && data.state) || load();
    if (s && s.setup) state = s;
    // a game saved between rounds by an older version moves on to the next round
    if (state.phase === 'roundEnd'){ const r = E.apply(state, { type:'nextround' }); if (!r.error){ state = r.state; save(); } }
    startAccounts(); // first: a waiting report goes out with the owner's session
    flushReports();
    // ?join=CODE opens the join screen with the code filled in
    let join = '';
    try { join = (new URLSearchParams(location.search).get('join') || '').toUpperCase(); } catch (e) {}
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(ONLINE_KEY) || 'null'); } catch (e) {}
    if (saved && saved.code && saved.token && (saved.server || serverBase()) && (!join || join === saved.code)){
      // rejoin the room this phone was in
      Object.assign(net, { code:saved.code, token:saved.token, name:saved.name || '', server:saved.server || serverBase(), want:true });
      netConnect();
      return;
    }
    const joining = join && CODE_RE.test(join) && onlineAvailable();
    if (joining){ ui.screen = 'online'; ui.joinCode = join; }
    render();
    // a guest with no saved name types one first, then taps Join room
    if (joining){ const n = document.getElementById('oname'); if (n && !n.value) n.focus(); }
  }
  // read-only view for tests and debugging in the console
  window.SevensDebug = Object.freeze({
    get state(){ return E.clone(state); },
    get net(){ return { code:net.code, seat:net.seat, status:net.status, rev:net.rev, room:net.room && E.clone(net.room) }; },
    get busy(){ return ui.busy || ui.rolling || ui.race; },
    get account(){ return { available:accountsAvailable(), signedIn:!!account, id:account ? account.id : null, name:account ? account.name : null }; }
  });
  try { window.claude?.hot?.snapshot?.(() => ({ state })); } catch (e) {}
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
